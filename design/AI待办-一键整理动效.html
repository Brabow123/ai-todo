<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>AI待办 · 一键识别动效预览</title>
<style>
/* AI待办 · 界面样式（对应 Design 画布「定稿汇总」） */
:root{
  --ink:#171A1F;--ink2:#3A404A;--mute:#5C6370;--faint:#8A909B;--line:#EEF0F4;--bg2:#F1F3F7;--bg3:#F4F6FA;
  --blue:#1A5CFF;--blue2:#1A4BD6;--blueBg:#EAF0FF;--blueBg2:#F4F7FF;
  --red:#C8281E;--redBg:#FDECEA;--green:#17663A;--greenBg:#E7F6EC;--warn:#9A4B00;--warnBg:#FFF1E0;
  --p0:#F8C9CE;--p0t:#951B32;--p1:#FFF0D6;--p1t:#89480D;--p2:#EFF1F5;--p2t:#535C6B;
  --card:0 1px 2px rgba(15,30,60,.06),0 14px 32px rgba(15,30,60,.16);
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:'PingFang SC','Helvetica Neue',system-ui,sans-serif;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
#app{display:flex;align-items:flex-start;gap:12px;padding:0}
#app.right{flex-direction:row-reverse;justify-content:flex-end}
#panel:empty{display:none}
#panel{width:460px;flex:none;display:flex;flex-direction:column;gap:10px}
#note{width:440px;flex:none;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:20px;box-shadow:var(--card);overflow:hidden;position:relative}
.drag{-webkit-app-region:drag}.nodrag{-webkit-app-region:no-drag}

/* 头部 / 横条 */
.head{display:flex;align-items:center;gap:7px;padding:11px 12px 8px 12px}
.bar{border-radius:18px;padding:9px 10px 9px 12px}
.pose{flex:none;width:34px;height:30px;display:flex;align-items:flex-end;justify-content:center}
.pose img{display:block;width:30px;transition:transform .15s}
.pose.peek img{width:38px;margin-top:-16px}
.pose.pop img{animation:pop .15s ease-out}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.brand{font-size:16px;font-weight:800;white-space:nowrap}
.conn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink2);border-radius:8px;padding:3px 6px;white-space:nowrap}
.conn:hover{background:var(--bg2)}
.conn.on{background:var(--blueBg2);box-shadow:0 0 0 1.5px var(--blue)}
.conn .st0{color:var(--mute);font-weight:600}
.conn.warn{background:var(--warnBg);color:var(--warn)}
.conn .dot{width:6px;height:6px;border-radius:50%;background:#B9C0CC}
.dk{width:16px;height:16px;border-radius:5px;background:var(--blue);color:#fff;font-size:9px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex:none}
.dk.big{width:40px;height:40px;border-radius:12px;font-size:14px}
.sp{flex:1}
.kbs{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--blue2);background:var(--blueBg);border-radius:10px;padding:6px 11px;white-space:nowrap}
.kbs:hover{background:#DCE6FF}
.kbs.busy{color:var(--mute);background:var(--bg2);cursor:default}
.ib{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.ib:hover{background:var(--bg2)}
.bsub{font-size:12px;font-weight:700;color:var(--blue2);background:var(--blueBg2);border-radius:8px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.bsub.warn{color:var(--red);background:var(--redBg)}.bsub.ok{color:var(--green);background:var(--greenBg)}
.cnt{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--blue2);background:var(--blueBg);border-radius:9px;padding:4px 8px}

/* 飘条 */
.flash{position:relative;display:flex;align-items:center;gap:8px;margin:2px 12px 6px;padding:9px 10px 11px 12px;border-radius:14px;background:var(--redBg);color:var(--red);font-size:13px;font-weight:800;overflow:hidden}
.flash.blue{background:var(--blueBg2);color:var(--blue2)}
.flash .go{background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;white-space:nowrap}
.flash .ubar{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.flash .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tab */
.tabrow{display:flex;align-items:center;gap:8px;padding:4px 12px 4px}
.tabs{flex:1;display:flex;gap:2px;background:var(--bg2);border-radius:10px;padding:3px}
.tabs button{flex:1;text-align:center;font-size:13px;font-weight:800;color:#4B515C;padding:6px 0;border-radius:8px;white-space:nowrap}
.tabs button em{font-style:normal;color:var(--faint);margin-left:3px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,30,60,.1)}
.tabs button.drop{background:var(--blueBg);color:var(--blue2);box-shadow:inset 0 0 0 1.5px var(--blue)}
.seg{display:flex;background:var(--bg2);border-radius:9px;padding:2px}
.seg button{font-size:12px;font-weight:800;color:#4B515C;padding:4px 9px;border-radius:7px}
.seg button.on{background:#fff;color:var(--ink)}

/* 清单 */
.list{max-height:460px;overflow-y:auto;padding:2px 0 4px}
.list::-webkit-scrollbar{width:0}
.gh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px;font-size:12px;font-weight:800;color:var(--mute)}
.gh.hot{color:var(--red)}
.nr{position:relative;display:flex;align-items:flex-start;gap:8px;padding:7px 14px 7px 6px;font-size:14px;cursor:default}
.nr:hover{background:var(--blueBg2)}
.nr .grip{width:10px;flex:none;opacity:0;margin-top:4px;cursor:grab;color:#B3BAC6}
.nr:hover .grip{opacity:1}
.nr.done .tx{color:var(--mute);background:linear-gradient(currentColor,currentColor) left center/100% 1px no-repeat}
.nr.striking .tx{animation:task-strike var(--strike-duration) ease-out var(--strike-delay) both}
@keyframes task-strike{from{background-size:0 1px}to{background-size:100% 1px}}
@media (prefers-reduced-motion:reduce){.nr.striking .tx{animation:none}}
.nr.done .plus{visibility:hidden}
.nr.dragging{opacity:.35}
.nr.dropbefore::before{content:'';position:absolute;left:14px;right:14px;top:-1px;height:2px;background:var(--blue);border-radius:2px}
.ck{width:16px;height:16px;border:1.5px solid #B9C0CC;border-radius:5px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ck:hover{border-color:var(--blue)}
.ck:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ck.on{background:var(--blue);border-color:var(--blue)}
.nb{flex:1;min-width:0}
.nt{display:flex;align-items:center;gap:6px;font-weight:700;line-height:20px;min-width:0}
.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pc{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:800;flex:none;cursor:pointer}
.pc:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.plus{display:none;font-size:12px;font-weight:800;color:var(--blue2);background:var(--blueBg);border-radius:8px;padding:2px 8px;white-space:nowrap;flex:none}
.nr:hover .plus{display:inline-flex}.plus:hover{background:var(--blue);color:#fff}
.p0{background:var(--p0);color:var(--p0t)}.p1{background:var(--p1);color:var(--p1t)}.p2{background:var(--p2);color:var(--p2t)}
.rt{font-size:13px;white-space:nowrap;flex:none;margin-top:1px;display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:0 3px;cursor:pointer}
.rt.red{color:var(--red);font-weight:800}.rt.blue{color:var(--blue2);font-weight:700}
.rt.due{color:var(--red);font-weight:600}
.rt.over{color:#fff;background:#D92D20;font-weight:800;padding:0 6px}
.nr.done .rt.over{color:var(--red);background:var(--redBg)}
.nr.done .rt.blue{color:var(--mute)}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;white-space:nowrap;flex:none}
.tag.f{color:var(--blue2);background:var(--blueBg)}.tag.y{color:var(--mute);background:var(--bg2)}.tag.j{color:var(--blue2);background:#fff;box-shadow:0 0 0 1px #DCE5FF}
.task-tags{display:inline-flex;vertical-align:top;align-items:center;flex-wrap:wrap;gap:3px;max-width:100%;min-width:0;text-align:left;border-radius:5px}
.nb>.task-tags{margin-top:4px}
.task-tags.compact{flex-wrap:nowrap}
.nt>.task-tags.compact{flex:none;max-width:40%}
.custom-tag{display:inline-block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;min-width:0;padding:1px 6px;border-radius:5px;font-size:11px;line-height:17px;font-weight:500}
.task-tags.compact .custom-tag{max-width:8em}
.tone-0{color:#485E80;background:#EAF0F8}.tone-1{color:#516B60;background:#E8F1EC}
.tone-2{color:#6C5C80;background:#F0ECF5}.tone-3{color:#4D6C71;background:#E7F1F2}.tone-4{color:#6E6453;background:#F2EFE8}
.tag-count{font-size:10px;font-weight:600;color:var(--mute);white-space:nowrap}
.task-tags:focus-visible,.tag-option:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.task-tags:hover .custom-tag{filter:brightness(.97)}
.srcl{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.sc2{font-size:11px;color:#4B515C;background:var(--bg2);border-radius:6px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px}
.pav{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--ink2);flex:none}
.emp{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 24px 24px}
.emp img{width:84px}
.emp b{font-size:15px;margin-top:8px}
.emp .es{font-size:13px;color:var(--mute);margin-top:4px;line-height:20px}
.emp .kbs{margin-top:12px}
.cele{margin:8px 12px 6px;border-radius:16px;background:var(--blueBg2);border:1px solid #DCE5FF;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.cele img{width:80px}.cele b{font-size:16px}.cele .cs{font-size:13px;color:#4B515C}

/* 行内弹层 */
.menu{margin:2px 14px 8px 46px;background:#fff;border-radius:12px;box-shadow:0 12px 30px rgba(15,30,60,.2);padding:6px;width:250px;position:relative;z-index:2}
.menu.r{margin-left:auto}
.menu .pt{font-size:12px;font-weight:800;color:var(--mute);padding:6px 8px 4px}
#taskPopover{position:fixed;top:0;left:0;z-index:20}
#taskPopover:empty{display:none}
#taskPopover .menu{margin:0;width:250px;max-height:310px;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);box-shadow:0 9px 23px rgba(36,54,80,.16),0 1px 4px rgba(36,54,80,.08)}
#taskPopover .task-action-menu{width:171px}
.task-action>span{display:flex;align-items:center;gap:7px}
.task-action>svg{color:var(--mute)}
.task-action-delete{color:#B42318}
.task-action-delete:hover{background:var(--redBg)}
.property-menu-head{display:flex;align-items:center;justify-content:space-between;min-height:27px;padding:0 3px 3px 6px}
.property-menu-head strong{font-size:13px;font-weight:700}
.property-close{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--mute)}
.property-close:hover{background:var(--bg2)}
#taskPopover button:focus-visible,.tag-remove:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:13px}
.mi:hover{background:var(--bg3)}
.mi.sel{background:var(--blueBg);color:var(--blue2);font-weight:800}
.mi .sub{color:var(--faint);font-size:12px}
.mi .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;background:currentColor}
.tag-picker{padding:0 2px 2px}
.tag-search-box{display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg3);color:var(--mute);border-radius:7px}
.tag-search-box svg{flex:none}
.tag-picker .tag-search-box .tag-search,.card.pool .tag-picker .tag-search-box .tag-search{width:100%;min-width:0;border:0;background:transparent;padding:7px 0;font:inherit;font-size:12px;outline:none}
.tag-search-box:focus-within{box-shadow:inset 0 0 0 1.5px var(--blue)}
.tag-section{padding:7px 6px 2px;color:var(--mute);font-size:11px;font-weight:600}
.tag-selected{display:flex;flex-wrap:wrap;gap:4px;max-height:60px;overflow:auto;margin:1px 0 6px;padding:0 2px}
.tag-remove{display:inline-flex;align-items:center;max-width:100%;min-width:0;padding-right:5px;border-radius:5px;background:var(--bg2);color:var(--mute)}
.tag-remove .custom-tag{background:transparent}
.tag-remove:hover{background:var(--blueBg)}
.tag-options{overflow-y:auto;max-height:145px;overscroll-behavior:contain}
#noteCard:has(.tag-picker){display:flex;flex-direction:column;max-height:var(--tag-panel-height)}
#noteCard:has(.tag-picker)>:not(.list){flex:none}
.card.pool:has(.tag-picker) .pl{min-height:54px}
.tag-option{padding:4px 6px;min-height:27px}
.tag-option[aria-pressed="true"]{background:var(--blueBg2)}
.tag-option-name{min-width:0;overflow-wrap:anywhere}
.tag-check{flex:none;color:var(--blue2);font-size:12px;font-weight:700}
.create-tag{color:var(--blue2);font-size:12px}
.tag-empty{margin:0;padding:5px 6px;color:var(--mute);font-size:12px}
.sep{height:1px;background:var(--line);margin:4px 2px}
.why{font-size:11.5px;color:var(--faint);padding:0 8px 6px 26px;line-height:17px}
.tin{width:100%;margin:2px 0 6px;padding:7px 9px;border-radius:8px;background:var(--bg3);border:0;outline:none;font-size:12px}
.tin:focus{box-shadow:inset 0 0 0 1.5px var(--blue);background:#fff}
.dtl{margin:2px 12px 8px 46px;border-radius:12px;background:var(--bg3);padding:10px 12px;font-size:12px;line-height:19px;color:var(--ink2)}
.dtl .qh{display:flex;align-items:center;gap:6px;color:var(--mute);margin-bottom:3px}
.dtl .qh a{margin-left:auto;color:var(--blue2);font-weight:800;cursor:pointer}
.task-times{display:grid;gap:2px;margin-top:6px}
.task-time{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:6px;width:100%;padding:4px 6px;text-align:left;color:var(--mute);border-radius:7px}
.task-time b{color:var(--ink2);font-weight:600}
.deadline-label,.task-time b.deadline-label{color:var(--red)}
.task-time:hover,.task-time:focus-visible{background:var(--blueBg);color:var(--blue2)}
.dtl .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-weight:800}
.dtl .acts button{padding:4px 8px;border-radius:7px;background:#fff}
.dtl .acts .del{background:none;color:#B42318;margin-left:auto}
.dtl input.edit{width:100%;border:0;border-radius:8px;padding:6px 8px;font-weight:700;font-size:14px;outline:none;box-shadow:inset 0 0 0 1.5px var(--blue);margin-bottom:6px}

/* 输入 */
.ibar{border-top:1px solid var(--line);margin-top:6px;padding:10px 12px 12px}
.ibox{display:flex;align-items:center;height:40px;border-radius:12px;background:var(--bg2);padding:0 12px}
.ibox:focus-within{background:#fff;box-shadow:0 0 0 1.5px var(--blue)}
.ibox input{flex:1;border:0;background:transparent;outline:none;font-size:13px}
.toast{display:flex;align-items:center;gap:12px;margin-top:8px;background:var(--ink);color:#C9CFD9;font-size:13px;font-weight:600;border-radius:10px;padding:9px 12px}
.toast .tx2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast b{color:#8FB0FF;cursor:pointer}

/* 连接面板 */
.cpanel{margin:0 12px 8px;border-radius:14px;box-shadow:0 0 0 1px var(--line),0 10px 24px rgba(15,30,60,.10);padding:10px}
.cph{display:flex;align-items:center;gap:10px;padding:2px 2px 10px;border-bottom:1px solid var(--line)}
.cpr{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:13px;border-top:1px solid #F3F4F7}
.cpr:first-of-type{border-top:0}
.tg{width:34px;height:20px;border-radius:10px;background:var(--blue);position:relative;flex:none;cursor:pointer}
.tg::after{content:'';position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.tg.off{background:#D5DAE3}.tg.off::after{right:auto;left:2px}
.cpf{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;font-weight:800;flex-wrap:wrap}
.cpf button{padding:6px 10px;border-radius:8px;background:var(--bg2);color:var(--ink2)}
.cpf .dis{background:none;color:#B42318;margin-left:auto}
.ss{font-size:12px;line-height:18px;color:var(--mute)}
.gl{max-height:150px;overflow:auto;margin-top:6px;border-radius:10px;background:var(--bg3);padding:4px 8px}
.gl label{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0}

/* 统一待办行（气泡 / 识别列表） */
.uhead{display:flex;gap:10px;align-items:center;padding:12px 12px 0 14px;font-size:13px}
.uhead .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hav{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink2);flex:none;position:relative}
.hav .g{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:3px;background:#0E7C86;border:1.5px solid #fff}
.urow{display:flex;gap:10px;align-items:center;padding:12px 12px 12px 12px;border-top:1px solid var(--line);transition:transform .25s,opacity .25s}
.urow.first{border-top:0;padding-top:8px}
.urow.out{transform:translateX(-40px);opacity:0}
.urow .rb{flex:1;min-width:0}
.urow .tt{font-size:15px;line-height:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.chip.ghost{border:1px dashed #C9CFD9;color:#6A707C;font-weight:600;background:#fff}
.chip.ddl,.draft-chip.ddl{background:var(--redBg);color:var(--red)}
.chip.rem{background:var(--blueBg);color:var(--blue2)}
.chip.per{background:var(--bg2);color:var(--ink2);padding-left:3px;cursor:default}
.chip.on{box-shadow:0 0 0 1.5px var(--blue)}
.where{font-size:12px;color:var(--mute);white-space:nowrap}
.bt{display:flex;flex-direction:column;gap:4px;flex:none;width:64px}
.bt .add{font-size:14px;font-weight:800;color:var(--blue2);background:var(--blueBg);border-radius:10px;padding:8px 0;text-align:center}
.urow:hover .bt .add,.bt .add:hover{background:var(--blue);color:#fff}
.bt .ign{font-size:14px;font-weight:700;color:var(--ink2);padding:6px 0;text-align:center;border-radius:10px}
.bt .ign:hover{background:var(--bg2)}
.more{position:absolute;right:8px;top:-8px;min-width:24px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;z-index:3}
.stack{position:relative;padding-bottom:12px}
.stack .peek2{position:absolute;left:12px;right:12px;bottom:0;height:30px;background:#fff;border-radius:18px;box-shadow:0 6px 16px rgba(15,30,60,.10)}
.urow .menu{margin-left:0}

/* 一键识别卡 */
.tile{width:40px;height:40px;border-radius:12px;background:var(--blue2);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hd{display:flex;gap:10px;align-items:center;padding:14px 14px 4px}
.sum{margin:8px 14px 6px;padding:10px 12px;border-radius:12px;background:var(--bg3);font-size:13px;line-height:20px}
.srcs{display:flex;gap:6px;margin-top:6px}.srcs span{font-size:11px;color:#4B515C;background:#fff;border-radius:6px;padding:1px 7px}
.fold{padding:10px 16px;font-size:13px;font-weight:700;color:var(--mute);border-top:1px solid var(--line);cursor:pointer}
.ft{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.kb1{font-size:14px;font-weight:800;color:#fff;background:var(--blue);border-radius:10px;padding:9px 16px}
.kb2{font-size:14px;font-weight:700;color:var(--ink2);background:var(--bg2);border-radius:10px;padding:9px 14px}
.cbox{display:flex;gap:14px;align-items:center;padding:16px}
.cbox img{width:92px}
.srcc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.scc{font-size:12px;font-weight:700;color:var(--faint);background:var(--bg3);border-radius:7px;padding:3px 8px}
.scc.ok{color:var(--green);background:var(--greenBg)}.scc.ing{color:var(--blue2);background:var(--blueBg)}.scc.fail{color:var(--warn);background:var(--warnBg)}
.pbar{height:4px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
.pbar i{display:block;height:4px;background:var(--blue);border-radius:2px;transition:width .4s}
.stopb{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink2);background:var(--bg2);border-radius:9px;padding:6px 10px;flex:none;align-self:flex-start}
.warnl{display:flex;align-items:center;gap:8px;margin:8px 14px 0;padding:8px 10px;border-radius:10px;background:#FFF6E5;color:#8A4B08;font-size:12px;font-weight:700}
.coach{display:flex;gap:8px;align-items:flex-start;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;line-height:18px}
.coach b{color:#8FB0FF}

/* 提醒到点 */
.rbh{display:flex;align-items:center;gap:10px;padding:12px 12px 2px 14px;font-size:13px}
.belt{width:28px;height:28px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.rbb{display:flex;gap:10px;align-items:center;padding:8px 12px 14px 52px}
.rbtn{display:flex;flex-direction:column;gap:4px;flex:none;width:72px}
.rbtn .done{font-size:14px;font-weight:800;color:var(--blue2);background:var(--blueBg);border-radius:10px;padding:8px 0;text-align:center}
.rbtn .done:hover{background:var(--blue);color:#fff}
.rbtn .later{font-size:14px;font-weight:700;color:var(--ink2);padding:6px 0;text-align:center;border-radius:10px}
.rbtn .later:hover,.rbtn .later.on{background:var(--bg2)}

/* 首次连接 */
.onb{padding:26px 24px 20px;display:flex;flex-direction:column;gap:14px}
.onb .ot{font-size:21px;line-height:29px;font-weight:900}
.onb .od{font-size:14px;line-height:22px;color:#4B515C}
.onb .hero{display:flex;justify-content:center}
.btnp{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;font-size:15px;font-weight:800;border-radius:12px;padding:12px 0}
.btns{display:block;width:100%;text-align:center;color:var(--mute);font-size:13px;font-weight:700;padding:4px 0}
.perm{border:1px solid #E6E9EF;border-radius:14px;overflow:hidden}
.pm2{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);font-size:13px;line-height:19px}
.pm2:first-child{border-top:0}
.pm2 b{display:block;font-size:14px}
.nope{font-size:12px;line-height:19px;color:var(--ink2);background:var(--bg3);border-radius:12px;padding:10px 12px}
.link{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#C9D6FF}.dots i.on{background:var(--blue)}
.cst{display:flex;flex-direction:column;gap:9px;background:var(--bg3);border-radius:14px;padding:12px 14px}
.st{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.st.todo{color:var(--faint)}.st.ing{font-weight:800}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div{background:var(--bg3);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--blue2)}
.stat span{font-size:11px;color:var(--mute)}
code.cmd{display:block;background:var(--ink);color:#E6E9EF;border-radius:10px;padding:10px 12px;font-size:12px;user-select:text}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flypill{position:fixed;z-index:50;display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;box-shadow:0 10px 24px rgba(26,92,255,.3);pointer-events:none;transition:transform .45s cubic-bezier(.5,0,.2,1),opacity .45s;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}

.conn.mini{padding:3px 4px}.conn .gdot{width:6px;height:6px;border-radius:50%;background:#22A06B}

.kbs.off{background:#E8F7EF;color:#1F8A55;margin-left:6px}.kbs.off:hover{background:#22A06B;color:#fff}
.offw{position:absolute;inset:0;z-index:30;background:linear-gradient(180deg,#FFF8E8 0%,#FFFFFF 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:offIn .25s ease-out}
@keyframes offIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.offw .conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.offw .conf i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;opacity:0;animation-name:fall;animation-timing-function:cubic-bezier(.3,.6,.5,1);animation-iteration-count:2;animation-fill-mode:forwards}
@keyframes fall{0%{opacity:1;translate:0 0;rotate:0deg}100%{opacity:0;translate:var(--dx,20px) 460px;rotate:540deg}}
.offw .bob{width:104px;animation:bob 1s ease-in-out infinite;position:relative}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.offw .ot{font-size:22px;margin-top:10px;position:relative}
.offw .on{font-size:15px;margin-top:6px;color:#2B2F36;position:relative}.offw .on em{font-style:normal;font-weight:800;color:#3370FF;font-size:22px;margin:0 2px}
.offw .os{font-size:13px;color:var(--mute);margin-top:6px;line-height:20px;position:relative}
.offw .ob{display:flex;gap:10px;margin-top:18px;position:relative}

.todayh{flex:1;font-size:15px;font-weight:800;padding:6px 6px}.todayh em{font-style:normal;color:var(--faint);font-weight:700;margin-left:6px}
.todayh.drop{background:var(--blueBg);border-radius:8px}
.poolbtn{font-size:13px;font-weight:800;color:var(--ink2);background:var(--bg2);border-radius:10px;padding:6px 12px;margin-right:8px;white-space:nowrap}
.poolbtn em{font-style:normal;color:var(--faint);margin-left:4px}.poolbtn:hover{background:#E3E8F0}
.poolbtn.on{background:var(--blueBg);color:var(--blue2)}.poolbtn.on em{color:var(--blue2)}
.poolbtn.drop{background:var(--blue);color:#fff}
.card.pool{display:flex;flex-direction:column;max-height:560px}
.card.pool .ph{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.card.pool .ph b{font-size:15px}.card.pool .ph em{font-style:normal;color:var(--faint);font-weight:700}
.card.pool .ph .ss{font-size:12px}
.card.pool .pl{flex:1;overflow:auto;min-height:120px;padding-bottom:4px}
.card.pool.drop{box-shadow:var(--card),inset 0 0 0 2px var(--blue)}
.card.pool .pf{padding:8px 12px 12px;border-top:1px solid var(--line)}
.card.pool .pf input{width:100%;border:none;outline:none;background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit}
.nr-end .dz{display:block;margin:4px 14px;padding:8px;border:1.5px dashed #BFD0FF;border-radius:10px;color:var(--blue2);font-size:12px;text-align:center}
.nr-end.drop .dz{background:var(--blueBg)}
.nr-end{min-height:6px}
.is-dragging [data-dropend="today"]{min-height:40px}
.is-dragging [data-dropend="pool"]{min-height:24px}
#app:not(.is-dragging) .drag-only,#app.is-dragging .drag-hidden{display:none}

/* 新增时直接设置属性，保留现有输入区风格 */
.draft-tools{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding-top:8px}
.draft-chip{font-size:11px;color:var(--ink2);background:var(--bg2);border-radius:7px;padding:5px 7px;cursor:pointer}
.draft-chip:hover,.draft-chip:focus-visible{background:var(--blueBg);color:var(--blue2)}
.draft-chip.ddl:hover,.draft-chip.ddl:focus-visible{background:#FBE0DC;color:var(--red)}
.draft-add{margin-left:auto;background:var(--blueBg);color:var(--blue2);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700}
.draft-add:disabled{opacity:.5}
#manualTools .menu,.composer .menu{margin:8px 0 0;width:min(290px,100%)}
.composer input{width:100%;min-width:0}
.draft-tools button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 首页轻量新增，属性进入二级设置；标题双击原位编辑。 */
.composer-secondary-head{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.title-edit{width:100%;min-width:0;flex:1;border:0;border-radius:6px;padding:2px 5px;background:#fff;outline:2px solid var(--blue);font:inherit;font-weight:700}
.row-more{width:22px;height:25px;margin-left:4px;flex:none;display:grid;place-items:center;color:var(--mute);border-radius:6px}
.row-more:hover,.row-more[aria-expanded="true"]{color:var(--blue2);background:var(--blueBg)}
.row-more:focus-visible,.composer-secondary-head .ib:focus-visible,.tx:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 视图 A：标题负责切换范围，工具只作用于当前视图。 */
#nTabs{position:relative;z-index:4}
.todayh{min-width:0;padding:0}
.view-title{display:inline-flex;align-items:center;gap:5px;max-width:100%;border-radius:7px;padding:5px 6px;line-height:21px;font:inherit}
.view-title span,.view-tool span,.view-item span:not(.view-check){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todayh .view-title em{margin:0}
.view-title svg{flex:none;color:var(--mute)}
.view-title:hover,.view-title[aria-expanded=true],.view-tool:hover,.view-tool.on,.view-tool[aria-expanded=true]{color:var(--blue2);background:var(--blueBg)}
.view-tools{display:flex;align-items:center;gap:4px;margin:0 13px 3px;padding:0 0 4px;border-bottom:1px solid var(--line)}
.view-tool{display:inline-flex;align-items:center;min-width:0;gap:4px;padding:4px 6px;border-radius:6px;font-size:11.5px;color:var(--mute);line-height:16px;white-space:nowrap}
.view-tool[data-v=filter]{max-width:38%}.view-tool[data-v=save]{margin-left:auto;flex:none}
.vi{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.view-popup{position:absolute;z-index:6;background:white;width:213px;border-radius:12px;padding:6px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(36,54,80,.16),0 1px 4px rgba(36,54,80,.08);max-height:240px;overflow:auto;overscroll-behavior:contain}
.view-caption{padding:5px 8px 6px;font-size:11px;font-weight:650;color:var(--mute)}
.view-item{width:100%;min-height:30px;display:flex;align-items:center;gap:7px;text-align:left;font-size:12px;color:var(--ink2);border-radius:7px;padding:7px 8px}
.view-item:hover{background:var(--bg3)}.view-item[aria-pressed=true]{background:var(--blueBg);color:var(--blue2);font-weight:650}
.sort-trigger{font-weight:650;background:var(--bg2);color:var(--ink2);flex-shrink:0}
.sort-trigger[aria-expanded=true] svg:last-child{transform:rotate(180deg)}
.view-popup.sort-menu{width:228px;max-width:calc(100% - 14px);padding:5px}
.sort-menu .view-item{gap:8px;min-height:46px;padding:7px;border-radius:8px}
.sort-icon{width:27px;height:27px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--bg2);color:#526074}
.sort-icon .vi{width:16px;height:16px}
.sort-menu [aria-pressed=true] .sort-icon{background:#dce7ff;color:var(--blue2)}
.sort-copy{min-width:0;flex:1;text-align:left}
.sort-copy strong{display:flex;gap:4px;align-items:center;font-size:12.5px;font-weight:650;line-height:18px}
.sort-copy>small{display:block;margin-top:1px;font-size:10.5px;font-weight:400;line-height:15px;color:var(--mute)}
.sort-menu [aria-pressed=true] .sort-copy>small{color:#4f6593}
.sort-default{padding:0 3px;border:1px solid #c9d3e2;border-radius:4px;color:#5f6d82;font-size:9px;font-weight:550;line-height:12px}
.sort-menu .view-check{margin-right:2px;font-size:14px}
.view-check{margin-left:auto;color:var(--blue2)}
#saveViewForm{display:grid;gap:8px;padding:5px;font-size:12px}
#saveViewForm label{font-weight:650}#saveViewForm input{width:100%;min-width:0;border:1px solid #cbd5e2;border-radius:7px;padding:7px 8px}
#saveViewForm button{background:var(--blue2);border-radius:7px;padding:6px;color:white}.view-error{color:var(--red)}
.view-title:focus-visible,.view-tool:focus-visible,.view-item:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

html { overflow: auto; background: #f0f3f9; }
body { overflow: visible; min-height: 100vh; }
.demo-frame { width: min(100% - 40px, 912px); margin: 0 auto; padding: 34px 0 60px; }
.demo-head { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; margin: 0 0 18px; }
.demo-head h1 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
.demo-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px; font-size: 12px; color: var(--mute); }
.demo-actions button { color: var(--blue2); font-weight: 650; white-space: nowrap; }
.demo-actions button:hover { text-decoration: underline; }
#app { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 440px); align-items: start; gap: 12px; }
#panel { grid-column: 1; grid-row: 1; }
#note { grid-column: 2; grid-row: 1; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.motion-progress .pbar i { transform-origin: left; }
.motion-mascot { width: 92px; flex: 0 0 92px; position: relative; }
.motion-mascot img { display: block; width: 100%; }
.motion-lens { position: absolute; top: 20%; left: 4%; width: 55%; height: 57%; border-radius: 100%; overflow: hidden; pointer-events: none; }
.lens-glint { position: absolute; inset: -10% 20%; opacity: 0; background: linear-gradient(90deg, transparent, #e1eeffca, transparent); }
.evidence-flow { display: grid; gap: 5px; padding: 0 14px 14px; }
.evidence-flow:empty { display: none; }
.evidence-row { border: 1px solid #e7edf7; border-radius: 10px; background: #f7f9fe; padding: 7px 10px; user-select: text; }
.evidence-meta { font-size: 11px; line-height: 1.35; color: var(--mute); margin-bottom: 3px; }
.evidence-text { font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.evidence-text mark { background: transparent; color: inherit; border-radius: 3px; }
[data-stage="think"] .evidence-text mark { background: #dce8ff; color: var(--blue2); font-weight: 700; }
.evidence-exit { position: absolute; pointer-events: none; z-index: 2; }
.motion-results .urow .tt { position: relative; z-index: 1; }
.preview-quote-toggle { color: var(--blue2); font-size: 12px; border-radius: 5px; padding: 2px 4px; }
.preview-quote-toggle:hover { background: var(--blueBg); }
.preview-quote { margin: 0 14px 8px; padding: 8px 11px; border-radius: 7px; background: var(--bg3); font-size: 12px; line-height: 1.6; user-select: text; overflow-wrap: anywhere; }
.preview-quote .ss { display: block; }
@media (max-width: 950px) {
  .demo-frame { width: min(100% - 28px, 460px); padding-top: 23px; }
  #app { grid-template-columns: minmax(0, 1fr); }
  #note { grid-column: 1; grid-row: 1; width: 100%; }
  #panel { grid-column: 1; grid-row: 2; width: 100%; }
}
@media (max-width: 445px) {
  .demo-head h1 { font-size: 17px; }
  .head { gap: 3px; padding-inline: 9px; }
  .head .pose { width: 30px; }
  .head .brand { font-size: 14px; }
  .head .kbs { padding-inline: 6px; font-size: 12px; }
  .head .st0 { display: none; }
  .head .ib { width: 22px; }
  .motion-mascot { width: 65px; flex-basis: 65px; }
  .cbox { gap: 9px; padding: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
  .flypill { display: none; }
}

body { background: radial-gradient(ellipse at 30% 8%, #e9f0fc 0%, transparent 62%), #f3f5fa; }
.demo-frame { padding-top: clamp(22px, 5vh, 50px); }
.demo-head { margin-bottom: 12px; }
.demo-head h1 { font-size: clamp(23px, 3vw, 32px); font-weight: 760; }
.demo-steps { display: flex; align-items: center; gap: 4px; margin-bottom: 19px; }
.demo-steps > span { color: var(--mute); font-size: 11px; margin-right: 5px; }
.demo-steps button { font-size: 12px; padding: 5px 10px; border-radius: 7px; color: #49556b; }
.demo-steps button[aria-current="step"], .demo-steps button:hover { background: #e0ebff; color: var(--blue2); }
.demo-steps button:disabled { opacity: .45; cursor: default; }
#demo-start { display: none; grid-row: 1; grid-column: 1; }
#app:has(#panel:empty) #demo-start { display: block; }
.motion-head { position: relative; display: grid; grid-template-columns: 112px minmax(0,1fr) auto; gap: 10px; align-items: center; min-height: 108px; padding: 11px 15px 10px 10px; background: linear-gradient(115deg,#edf4ff,#fbfcff 78%); }
.motion-head h2 { font-size: 16px; line-height: 1.4; margin: 0 0 3px; }
.motion-head .stopb { align-self: start; margin: 3px 0 0; }
.motion-head .ss { font-size: 12px; }
.motion-art { position: relative; isolation: isolate; width: 112px; height: 82px; pointer-events: none; }
.motion-art .paper { position: absolute; top: 25px; left: 8px; width: 44px; height: 31px; background: #fff; box-shadow: 0 2px 6px #31578623; border: 1px solid #b8cdf5; border-radius: 5px; transform: rotate(-11deg); }
.motion-art .paper.back { left: 12px; top: 16px; transform: rotate(7deg); background: #d7e6ff; }
.motion-art .paper::before, .motion-art .paper::after { content: ''; position: absolute; height: 2px; left: 6px; border-radius: 2px; background: #a5bff1; }
.motion-art .paper::before { top: 9px; width: 20px; }
.motion-art .paper::after { top: 15px; width: 13px; }
.motion-art .figure { position: absolute; width: 66px; height: 65px; top: 7px; left: 39px; display: grid; place-items: center; transform-origin: 50% 84%; }
.motion-art img { width: 100%; height: 100%; object-fit: contain; }
.motion-art .figure::after { position: absolute; z-index: -1; content: ''; bottom: -3px; width: 50%; height: 5px; background: #5784ce25; border-radius: 50%; filter: blur(2px); }
.motion-sources { display: flex; gap: 8px; margin: 0 14px; padding: 9px 0; }
.motion-sources span { flex: 1; position: relative; color: #63718a; padding-top: 6px; font-size: 10px; font-weight: 600; }
.motion-sources span::before, .motion-sources i { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 2px; }
.motion-sources span::before { content: ''; background: #e6ecf8; }
.motion-sources i { background: var(--blue); transform: scaleX(0); transform-origin: left; }
.motion-sources [data-state="ing"] { color: var(--blue2); }
.motion-sources [data-state="ok"] i { transform: scaleX(1); background: #a7c3ff; }
.motion-progress .evidence-flow { gap: 7px; padding-bottom: 13px; }
.motion-progress .evidence-row { position: relative; display: grid; grid-template-columns: 26px minmax(0,1fr); align-items: center; gap: 8px; padding: 8px 10px; background: #f8faff; }
.motion-progress .evidence-row[data-current="true"] { background: #f2f6ff; border-color: #c4d8ff; }
.evidence-avatar { display: grid; place-items: center; width: 26px; height: 26px; background: #e0eaff; color: #284a88; border-radius: 8px; font-weight: 700; font-size: 11px; }
[data-evidence="group"] .evidence-avatar { background: #e7ebef; color: #53616c; }
[data-evidence="minutes"] .evidence-avatar { background: #ebe9ff; color: #5b5096; }
.evidence-text mark { position: relative; isolation: isolate; }
[data-stage="think"] .evidence-text mark { color: #1747b0; background: transparent; }
[data-stage="think"] .evidence-text mark::before { position: absolute; z-index: -1; content: ''; inset: -1px -2px; background: #cfdeff; border-radius: 3px; transform-origin: left; animation: underline-action 450ms var(--mark-delay,0ms) cubic-bezier(.2,.75,.2,1) backwards; }
@keyframes underline-action { from { transform: scaleX(0); } to { transform: scaleX(1); } }
[data-stage="think"] .evidence-text { color: #58677c; }
.reading-loupe { position: absolute; top: 0; left: 0; width: 34px; height: 34px; z-index: 4; pointer-events: none; }
.reading-loupe::after { content: ''; position: absolute; width: 3px; height: 10px; bottom: -6px; right: 1px; transform: rotate(-42deg); border-radius: 3px; background: #5177bf; }

<script>
// 主进程和界面共用的规则：截止、提醒规则和时间格式。
// 在 Node 里 require，在界面里用 <script> 直接加载（挂到 window.Shared）。
(function (root) {
  const DAY = 864e5;
  const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const addDays = (t, n) => { const d = new Date(startOfDay(t)); d.setDate(d.getDate() + n); return d.getTime(); };
  const at = (day, hm) => { const [h, m] = hm.split(':').map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return d.getTime(); };
  const pad = (n) => String(n).padStart(2, '0');
  const hm = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  // 本周一 / 下周一
  const mondayOf = (t) => { const s = startOfDay(t); const wd = new Date(s).getDay(); return addDays(s, -((wd + 6) % 7)); };
  const isWeekend = (t) => [0, 6].includes(new Date(t).getDay());

  /** 日子的说法：今天 / 明天 / 周五 / 下周三 / 12/20 */
  function dayWord(t, now = Date.now()) {
    const s = startOfDay(t), t0 = startOfDay(now);
    const diff = Math.round((s - t0) / DAY);
    if (diff === 0) return '今天';
    if (diff === 1) return '明天';
    if (diff === -1) return '昨天';
    const thisMon = mondayOf(now), nextMon = addDays(thisMon, 7);
    if (s >= thisMon && s < nextMon) return WD[new Date(s).getDay()];
    if (s >= nextMon && s < addDays(nextMon, 7)) return '下' + WD[new Date(s).getDay()];
    const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()}`;
  }
  /** 截止标签：默认下班时间用「今天截止」，指定时刻用「今天 15:00截止」。 */
  function deadlineLabel(due, now = Date.now(), workEnd = '18:30') {
    if (!due) return '';
    const day = dayWord(due, now);
    const time = hm(due);
    return time === workEnd ? `${day}截止` : `${day} ${time}截止`;
  }
  function remindWord(t, now = Date.now()) {
    if (!t) return '';
    return startOfDay(t) === startOfDay(now) ? hm(t) : `${dayWord(t, now)} ${hm(t)}`;
  }

  /**
   * 推荐提醒：有截止才推荐。返回 {at, why} 或 null。
   * 规则：今天截止 → 截止前 30 分钟；明天到本周 → 截止前一天上午 10:00（已过 → 今天下班前）；下周及以后 → 截止前一天上午。
   * 只推荐工作时间，周末往前挪到周五。
   */
  function recommendRemind(due, now = Date.now(), s = {}) {
    if (!due || due <= now) return null;
    const workEnd = s.workEnd || '18:30';
    const t0 = startOfDay(now);
    const beforeEnd = at(t0, workEnd) - 60 * 60e3; // 今天下班前 = 下班前 1 小时
    if (startOfDay(due) === t0) {
      const r = due - 30 * 60e3;
      return r > now + 5 * 60e3 ? { at: r, why: '截止前 30 分钟' } : null;
    }
    let day = addDays(due, -1);
    while (isWeekend(day) && day > t0) day = addDays(day, -1);
    let r = at(day, '10:00');
    if (r > now + 5 * 60e3) return { at: r, why: '截止前一天上午' };
    if (beforeEnd > now + 5 * 60e3 && beforeEnd < due) return { at: beforeEnd, why: '今天下班前' };
    r = at(startOfDay(due), '10:00');
    if (r > now + 5 * 60e3 && r < due) return { at: r, why: '截止当天上午' };
    return null;
  }

  /** 提醒弹层里的两个快捷选项（和推荐重复的不列） */
  function remindOptions(due, now = Date.now(), s = {}) {
    const workEnd = s.workEnd || '18:30';
    const t0 = startOfDay(now);
    const beforeEnd = at(t0, workEnd) - 60 * 60e3;
    const rec = recommendRemind(due, now, s);
    let opts = [];
    if (!due) {
      opts = [['今天下班前', beforeEnd], ['明天上午', at(addDays(t0, 1), '09:30')], ['下周一上午', at(addDays(mondayOf(now), 7), '09:30')]];
    } else if (startOfDay(due) === t0) {
      opts = [['半小时后', now + 30 * 60e3], ['1 小时后', now + 60 * 60e3]];
    } else if (startOfDay(due) < addDays(mondayOf(now), 7)) {
      opts = [['今天下班前', beforeEnd], ['截止当天上午', at(startOfDay(due), '09:30')]];
    } else {
      opts = [['明天上午', at(addDays(t0, 1), '09:30')], ['截止当天上午', at(startOfDay(due), '09:30')]];
    }
    opts = opts.filter(([, t]) => t > now + 60e3 && (!rec || Math.abs(t - rec.at) > 30 * 60e3)).slice(0, 3);
    return { rec, opts: opts.map(([label, t]) => ({ label, at: t })) };
  }

  /** 截止弹层的快捷选项 */
  function dueOptions(now = Date.now(), s = {}) {
    const workEnd = s.workEnd || '18:30';
    const t0 = startOfDay(now);
    const fri = addDays(mondayOf(now), 4);
    const opts = [at(t0, workEnd), at(addDays(t0, 1), workEnd)];
    if (fri > addDays(t0, 1)) opts.push(at(fri, workEnd));
    const nextMon = addDays(mondayOf(now), 7);
    if (nextMon !== addDays(t0, 1)) opts.push(at(nextMon, workEnd));
    return opts.filter(t => t > now);
  }

  const tagName = (value) => typeof value === 'string' ? value.normalize('NFC').trim().replace(/\s+/gu, ' ') : '';
  const tagKey = (value) => tagName(value).toLowerCase();
  const api = { DAY, WD, startOfDay, addDays, at, hm, mondayOf, dayWord, deadlineLabel, remindWord, recommendRemind, remindOptions, dueOptions, tagName, tagKey };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Shared = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 同一份待办数据的查看规则，供主进程校验和便签渲染共用。
(function (root) {
  function config(scope = 'today', tag = '', sort = 'manual', group = false) {
    return { scope, tag, sort, group };
  }
  const builtins = [
    { id: 'today', name: '今天', icon: 'calendar', config: config() },
    { id: 'all', name: '全部待办', icon: 'stack', config: config('all') },
    { id: 'deadline', name: '近期截止', icon: 'clock', config: config('all', '', 'due') },
  ];
  function selectTasks(tasks, view) {
    const selected = tasks.filter(t =>
      (view.scope === 'all' || t.list === 'today') && (!view.tag || t.tags?.includes(view.tag)));
    const priority = { P0: 0, P1: 1, P2: 2 };
    return selected.sort((a, b) => {
      if (view.sort === 'due' && a.due !== b.due) {
        const first = a.due ?? Infinity, second = b.due ?? Infinity;
        if (first !== second) return first - second;
      }
      if (view.sort === 'priority') {
        const delta = (priority[a.priority] ?? 3) - (priority[b.priority] ?? 3);
        if (delta) return delta;
      }
      if (a.list !== b.list) return a.list === 'today' ? -1 : 1;
      return (a.order || 0) - (b.order || 0);
    });
  }
  function tagGroups(tasks, library) {
    const groups = new Map(library.map(name => [name, []]));
    const untagged = [];
    for (const task of tasks) {
      if (!task.tags?.length) untagged.push(task);
      for (const name of new Set(task.tags || [])) {
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(task);
      }
    }
    return [...groups, [null, untagged]].filter(([, rows]) => rows.length);
  }
  function sameConfig(a, b) {
    return a.scope === b.scope && a.tag === b.tag && a.sort === b.sort && a.group === b.group;
  }
  const api = { config, builtins, selectTasks, tagGroups, sameConfig };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.TaskViews = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

// 从中文里解析截止时间；没说就返回 null（没有截止时间的事不默认标 deadline）
function parseDue(text, now = new Date(), workEnd = '18:30') {

  else if (/后天/.test(text)) day = addDays(2);
  else if ((m = text.match(/下(个)?(周|星期|礼拜)([一二三四五六日天])/))) {

  } else if ((m = text.match(/(\d{1,2})[号日](之前|前|下班)?/))) {
    day = new Date(base.getFullYear(), base.getMonth(), Number(m[1]));
    if (day < base) day.setMonth(day.getMonth() + 1);

  if (!day && /(上午|中午|下午|晚上|今晚|傍晚)?\s*\d{1,2}\s*[点:：]/.test(text) && /(前|之前|截止|给我|交|发)/.test(text)) day = addDays(0);

}

function cleanTitle(text) {
  let s = String(text)
    .replace(/<@[^>]+>/g, '')
    .replace(/@\S+?(\s|$)/g, ' ')
    .replace(/\[[^\]]{1,6}\]/g, '') // [微笑] 之类表情
    .replace(/https?:\/\/\S+/g, '（链接）')
    .replace(/\s+/g, ' ')
    .trim();
  s = s.replace(/^(你好|您好|hi|hello|在吗|好的|好嘞|收到|ok|嗯嗯?)[，,！!。\s]*/i, '');
  s = s.replace(/^(麻烦|辛苦|请|帮忙|帮我)(你|您)?(一下)?[，,\s]*/, '');
  s = s.replace(/[。！!~～\s]+$/, '');
  if (s.length > 48) s = s.slice(0, 46) + '…';
  return s;
}

// 优先级：P0 紧急 / P1 重要 / P2 一般 / null 没判出来（界面上是虚线「+P」）
function priorityOf(text, due, now, { atMe }) {

  if (due && due - now.getTime() < 24 * 3600e3) return 'P1';

}

function isMe(msg, me) {

  if (me.userId && msg.senderId && msg.senderId === me.userId) return true;
  if (me.openDingTalkId && msg.senderId && msg.senderId === me.openDingTalkId) return true;
  if (me.name && msg.senderName && msg.senderName === me.name) return true;
  return false;
}

    const mine = isMe(m, me);

    let direction = null;
    if (selfChat && mine) direction = 'self';
    else if (!mine && (m.atMe || !m.isGroup) && REQUEST.test(text)) direction = 'toMe';
    else if (!mine && m.isGroup && me?.name && text.includes(me.name) && REQUEST.test(text)) direction = 'toMe';

      ? { type: 'self', name: '文件小助手' }
      : m.isGroup
        ? { type: 'group', name: m.convName || '群聊', person: mine ? '' : m.senderName }
        : { type: 'person', name: mine ? (m.convName || '对方') : (m.senderName || m.convName || '同事') };

function bigrams(s) {
  const t = String(s).replace(/[\s，,。.!！?？:：、（）()「」"'“”]/g, '').toLowerCase();
  const set = new Set();
  for (let i = 0; i < t.length - 1; i++) set.add(t.slice(i, i + 2));
  if (t.length === 1) set.add(t);
  return set;
}
function similarity(a, b) {
  const A = bigrams(a), B = bigrams(b);
  if (!A.size || !B.size) return 0;
  let inter = 0; A.forEach((x) => B.has(x) && inter++);
  return inter / (A.size + B.size - inter);
}

/** 给候选标上：new / inlist（已在清单）/ dup（很像，指向 matchId） */
function markAgainst(cands, tasks) {
  return cands.map((c) => {
    const exact = tasks.find((t) => t.originId === c.id);
    if (exact) return { ...c, fit: 'inlist', matchId: exact.id, matchTitle: exact.title };
    let best = null, score = 0;
    for (const t of tasks) {
      if (t.done) continue;
      const s = similarity(c.title, t.title);
      if (s > score) { score = s; best = t; }
    }
    if (best && score >= 0.75) return { ...c, fit: 'inlist', matchId: best.id, matchTitle: best.title };
    if (best && score >= 0.4) return { ...c, fit: 'dup', matchId: best.id, matchTitle: best.title };
    return { ...c, fit: 'new' };
  });
}

      .map((s) => ({ ...s, state: 'todo', n: null }));
    const p = this.tidying = { stage: 'read', reading: sources[0]?.label || '', sources, found: 0, pct: 4, cancel: false, startedAt: Date.now() };
    const tick = () => this.emit('tidy', { ...p, cancel: undefined });
    const set = (key, patch) => { const s = sources.find((x) => x.key === key); if (s) Object.assign(s, patch); };
    tick();
    const d = this.data;
    const since = days ? Date.now() - days * DAY : Math.max(Math.min(d.marks.lastTidyAt || 0, Date.now() - 12 * 3600e3), S.at(Date.now() - DAY, this.settings.workEnd) - 0);

      set('private', { state: 'ing' }); set('group', { state: 'ing' }); tick();

<script>
// Standalone preview bridge. Use the desktop engine's task mutations against an isolated store.

    const doneAt = Date.now() - 60_000;
    const add = (id, title, order, fields) => ({
      id, title, order, list: 'today', tags: [], source: { type: 'manual' }, done: false, ...fields

        add('app-3', 'OKR | 想做什么', 2, { priority: 'P1', due: nextMonday, done: true, doneAt }),
        add('app-4', 'Zoom Slides+微软Copilot｜产品调研', 3, { priority: 'P0', due: nextMonday }),
        add('app-5', '整理体验记录', 4),
        add('pool-1', '归档交互走查记录', 0, { list: 'pool', tags: ['体验优化'] }),
        add('pool-2', '更新产品竞品清单', 1, { list: 'pool', tags: ['竞品调研'] }),
        add('pool-3', '补全周报素材', 2, { list: 'pool' })
      ],
      tagLibrary: ['长期跟进', '体验优化', '竞品调研'],
      savedViews: [],
      candidates: [],
      ignored: [],
      settings: {
        onboarded: true, density: 'simple', workStart: '09:30', workEnd: '18:30',
        sources: { private: true, group: true, minutes: true, calendar: true },
        excludedGroups: [], tips: { tidy: true }
      },
      marks: { lastSyncAt: Date.now(), everConnected: true }
    };
  }

  const data = seed();
  const engine = new window.DemoEngine({ get: () => data, save() {} }, { enabled: false }, { demoMode: true });
  engine.conn = { state: 'connected' };
  engine.lastGroups = ['设计项目群'];

  function snapshot() {
    return {
      demo: true, side: 'left', conn: engine.conn, me: engine.me,
      tasks: data.tasks.filter((task) => !task.done || task.doneAt >= shared.startOfDay()),
      candidates: data.candidates.filter((candidate) => !candidate.handled),
      tagLibrary: data.tagLibrary, savedViews: data.savedViews, alerts: engine.alerts,
      settings: data.settings, marks: data.marks, groups: engine.lastGroups, now: Date.now()
    };
  }

  engine.on('change', () => publish('state', snapshot()));

  function exampleMessages() {
    const time = Date.now() - 6 * 60_000;
    const parseDue = (text) => window.DemoRecognize.parseDue(text, new Date(), data.settings.workEnd);
    return [
      { key: 'private', label: '私聊', source: { type: 'person', name: '林宇', time },
        before: '麻烦明天 18:00 前', title: '发一版动效稿', after: '给我。',
        due: parseDue('明天18:00'), priority: 'P1' },
      { key: 'group', label: '群聊', source: { type: 'group', name: '设计项目群', person: '周宁', time },
        before: '收到，大家辛苦啦！' },
      { key: 'minutes', label: '会议听记', source: { type: 'meet', name: '产品周会', time },
        before: '明早 10:00 前，你来', title: '补齐演示稿里的空状态', after: '。',
        due: parseDue('明早10:00'), priority: 'P2' }

      (item.key !== 'group' || !data.settings.excludedGroups.includes(item.source.name)));

  let run = null;
  function tidy({ previewStep = 'read' } = {}) {
    if (run) return run.promise;

    const sources = evidence.map(({ key, label }) => ({ key, label, state: 'wait' }));
    const execution = { timer: null, finish: null, promise: null };
    run = execution;

    execution.promise = new Promise((resolve) => {
      const unhandled = () => evidence.filter((item) => item.title &&
        !data.candidates.some((candidate) => candidate.id === 'motion-' + item.key && candidate.handled));
      execution.finish = (stopped) => {
        clearTimeout(execution.timer);
        run = null;
        if (stopped) { resolve(null); return; }

        const main = unhandled().map((item) => {
          const id = 'motion-' + item.key;
          const existing = data.candidates.find((candidate) => candidate.id === id);
          if (existing) return existing;
          const candidate = {
            id, title: item.title, due: item.due, priority: item.priority, source: item.source,
            quote: item.before + item.title + item.after,
            direction: 'askMe', why: '原话明确提到了要你处理的事项'
          };
          data.candidates.push(candidate);
          return candidate;
        });
        resolve(structuredClone({
          main, maybe: [], at: Date.now(),
          stats: { messages: evidence.filter((item) => item.key !== 'minutes').length,
            private: Number(sources.some((source) => source.key === 'private')),
            groupMsgs: Number(sources.some((source) => source.key === 'group')),
            meetings: Number(sources.some((source) => source.key === 'minutes')),
            sources: sources.map((source) => ({ ...source, state: 'ok' })), ms: Date.now() - startedAt }
        }));
      };

      function read(index) {
        const current = evidence[index];
        if (!current) {
          const selected = unhandled();
          publish('tidy', { stage: 'think', sources, pct: 94, found: selected.length, startedAt,
            evidence: selected, previewFrame: 'think' });
          execution.timer = setTimeout(() => execution.finish(false), previewStep === 'deliver' ? 800 : 1510);
          return;
        }
        const duration = previewStep === 'extract' ? 560 : 1240;
        sources.forEach((entry, i) => { entry.state = i === index ? 'ing' : i < index ? 'ok' : 'wait'; });
        publish('tidy', { stage: 'read', reading: current.label, sources, pct: 21 + (index + 1) * 19,
          evidence: evidence.slice(0, index + 1), previewFrame: current.key, startedAt, duration });
        execution.timer = setTimeout(() => read(index + 1), duration);
      }

      const entry = previewStep === 'deliver' ? evidence.length
        : previewStep === 'extract' ? Math.max(0, evidence.length - 1) : 0;
      read(entry);
    });
    return execution.promise;
  }

  const actions = {
    state: snapshot,
    layout() {},
    tidy,
    cancelTidy: () => run?.finish(true),
    settings(patch) {
      Object.entries(patch).forEach(([key, value]) => {
        data.settings[key] = value && typeof value === 'object' && !Array.isArray(value)
          ? { ...data.settings[key], ...value } : value;
      });
      engine.save();
    },
    sync() { data.marks.lastSyncAt = Date.now(); engine.save(); },
    openDingTalk() { window.previewStatus('这条原话来自演示数据'); },
    openTerminalLogin() { window.previewStatus('演示使用示例连接'); },
    quit() { window.previewStatus('可关闭此预览标签页'); },
    copy(text) { return navigator.clipboard?.writeText(text).catch(() => {}); },
    parseTime(text) { return window.DemoRecognize.parseDue(text, new Date(), data.settings.workEnd) || Date.parse(text) || null; }
  };

  for (const method of ['add', 'addAll', 'ignore', 'unignore', 'unadd', 'bubbleSeen', 'addManual', 'saveView',
    'registerTag', 'toggleTag', 'update', 'move', 'remove', 'restore', 'snooze', 'dismissAlert', 'disconnect', 'connect']) {
    actions[method === 'connect' ? 'reconnect' : method] = engine[method].bind(engine);
  }

  window.xd = {
    on: (name, listener) => listeners.set(name, listener),
    async act(name, ...args) {
      try { return structuredClone(await actions[name](...args)); }
      catch (error) { return { __error: error.message }; }
    }
  };
})();

    const row = v => choice(v.id, viewIcon(v.icon || 'save') + `<span>${esc(v.name)}</span>`, v.id === viewState.id);
    body = heading('切换视图') + Views.builtins.map(row).join('');
    if (S.savedViews?.length) body += '<div class="sep"></div>' + heading('已保存的视图') + S.savedViews.map(row).join('');
  } else if (key === 'filter') {
    body = heading('按标签筛选') + choice('', '所有标签', !c.tag) + S.tagLibrary.map(n => choice(n, tagPill(n), n === c.tag)).join('');
    if (!S.tagLibrary.length) body += heading('给任务加标签后可在这里筛选');
  } else if (key === 'sort') {
    body = Object.entries(sortRules).map(([id, rule]) => {
      const badge = id === 'manual' ? '<small class="sort-default">默认</small>' : '';
      return choice(id, `<span class="sort-icon">${viewIcon(rule.icon)}</span><span class="sort-copy"><strong>${rule.title}${badge}</strong><small>${rule.hint}</small></span>`, c.sort === id);
    }).join('');
  } else if (key === 'save') {
    body = `<form id="saveViewForm"><label for="viewName">保存为新视图</label>
      <input id="viewName" maxlength="30" required autocomplete="off" value="${esc(viewState.name)}">
      ${viewState.error ? `<div role="alert" class="view-error">${esc(viewState.error)}</div>` : ''}
      <button type="submit" ${viewState.saving ? 'disabled' : ''}>保存</button></form>`;
  }
  return `<div class="view-popup${key === 'sort' ? ' sort-menu' : ''}" role="group" aria-label="${key === 'sort' ? '排序方式' : '视图选项'}">${body}</div>`;
}
function positionViewPopup() {
  const card = $('#noteCard');
  if (!card) return;
  card.style.minHeight = '';
  const popup = $('#nTabs .view-popup');
  if (!popup) return;
  const trigger = $(`#nTabs [data-a="viewMenu"][data-v="${viewState.menu}"]`);
  const box = $('#nTabs').getBoundingClientRect(), anchor = trigger.getBoundingClientRect();
  popup.style.left = Math.max(7, Math.min(anchor.left - box.left, box.width - popup.offsetWidth - 7)) + 'px';
  popup.style.top = (anchor.bottom - box.top + 4) + 'px';
  card.style.minHeight = Math.ceil(popup.getBoundingClientRect().bottom - card.getBoundingClientRect().top + 8) + 'px';
}
function closeViewMenu(restoreFocus = false) {
  const previous = viewState.menu;
  if (!previous) return;
  viewState.menu = null;
  $('#nTabs .view-popup')?.remove();
  const button = $(`#nTabs [data-a="viewMenu"][data-v="${previous}"]`);
  button?.setAttribute('aria-expanded', 'false');
  positionViewPopup();
  if (restoreFocus) button?.focus({ preventScroll: true });
  requestAnimationFrame(reportSize);
}
function inheritNewViewTag(tag) {
  const draft = ui.drafts.today;
  if (tag && tag !== viewState.config.tag && draft.tags && !draft.tags.includes(tag)) {
    draft.tags = [...draft.tags, tag];
  }
}
function changeView(v) {
  inheritNewViewTag(v.config.tag);
  viewState.id = v.id;
  viewState.config = { ...v.config };
  ui.menu = null;
  ui.openRow = null;
  viewState.menu = null;
  const list = $('#nList');
  if (list) list.scrollTop = 0;
}
function toggleViewMenu(button) {
  const key = button.dataset.v;
  if (viewState.menu === key) { closeViewMenu(true); return; }
  clearTimeout(titleClickTimer);
  ui.menu = null;
  viewState.menu = key;
  if (key === 'save') {
    const c = viewState.config;
    const label = c.tag || (c.scope === 'today' ? '今天' : '全部待办');
    viewState.name = (label + (c.sort === 'due' ? ' · 按截止' : c.sort === 'priority' ? ' · 按优先级' : '')).slice(0, 30);
    viewState.error = '';
  }
  render();
  if (key === 'save') { $('#viewName')?.focus(); $('#viewName')?.select(); }
  else $('.view-popup [aria-pressed="true"]')?.focus({ preventScroll: true });
}
function pickViewOption(button) {
  const key = viewState.menu, value = button.dataset.v;
  if (key === 'views') {
    const next = availableViews().find(v => v.id === value);
    if (!next) return;
    changeView(next);
  } else {
    const field = { filter: 'tag', sort: 'sort' }[key];
    if (!field) return;
    if (field === 'tag') inheritNewViewTag(value);
    viewState.config[field] = value;
    ui.menu = null; ui.openRow = null; viewState.menu = null;
    $('#nList').scrollTop = 0;
  }
  render();
  $(`#nTabs [data-a="viewMenu"][data-v="${key}"]`)?.focus({ preventScroll: true });
}
document.addEventListener('submit', async event => {
  if (event.target.id !== 'saveViewForm') return;
  event.preventDefault();
  if (viewState.saving) return;
  viewState.saving = true;
  try {
    const saved = await A('saveView', $('#viewName').value, viewState.config);
    changeView(saved);
  } catch (error) { viewState.error = error.message; }
  finally {
    viewState.saving = false;
    render();
    if (viewState.menu === 'save') $('#viewName')?.focus();
    else $('#nTabs [data-v="views"]')?.focus({ preventScroll: true });
  }
});

<script>
// Preview-only motion and a source transcript on the original candidate card.
const openPreviewQuotes = new Set();
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
const settle = 'cubic-bezier(.16,1,.3,1)';

function art(pose) {
  return `<div class="motion-art" aria-hidden="true"><i class="paper back"></i><i class="paper front"></i><span class="figure"><img src="${POSE(pose)}" alt=""></span></div>`;
}

function evidenceHtml(progress) {
  return '<div class="evidence-flow">' + (progress.evidence || []).map((item, index) => {
    const who = srcWho(item.source);
    const where = srcWhere(item.source);
    return `<div class="evidence-row" data-current="${progress.previewFrame === item.key}" data-evidence="${esc(item.key)}" style="--mark-delay:${index * 240}ms">
      <span class="evidence-avatar" aria-hidden="true">${esc((who || where || '会')[0])}</span>
      <div><div class="evidence-meta">${esc(who ? who + ' · ' + where : where)}${item.source.type === 'meet' ? ' · 听记' : ''}</div>
      <div class="evidence-text">${esc(item.before)}${item.title ? `<mark>${esc(item.title)}</mark>` : ''}${esc(item.after || '')}</div></div>
    </div>`;
  }).join('') + '</div>';
}

function progressCard(p) {
  const think = p.stage === 'think';
  const sources = (p.sources || []).map(s => `<span data-state="${think ? 'ok' : esc(s.state)}"><i></i>${esc(s.label)}</span>`).join('');
  return `<section class="card motion-progress" data-stage="${think ? 'think' : 'read'}"><header class="motion-head">
    ${art(think ? 'think' : 'search')}<div role="status"><h2>${think ? '这几句话里，有事要做' : '小钉在翻消息…'}</h2>
    <p class="ss">${think ? (p.found ? '正在摘出原话里的行动' : '正在核对已有待办') : '正在读「' + esc(p.reading || '消息') + '」'}</p></div>
    <button class="stopb" data-a="tidyStop">${I.stop}停止</button></header><div class="motion-sources">${sources}</div>${evidenceHtml(p)}</section>`;
}

function animateMotion(el, frames, options) {
  if (!el || document.hidden || motionPreference.matches || !el.animate) return;
  return el.animate(frames, { easing: settle, ...options });
}

// The lens contains the actual text beneath it. Its inner surface moves opposite the glass.
function readThroughLens(row, duration) {
  if (!row || motionPreference.matches || document.hidden) return;
  const line = row.querySelector('.evidence-text');
  const rect = line.getBoundingClientRect();
  const rowRect = row.getBoundingClientRect();
  const range = document.createRange();
  range.selectNodeContents(line);
  const firstLine = range.getClientRects()[0];
  if (!firstLine) return;
  const phrase = line.querySelector('mark')?.getBoundingClientRect();
  const start = rect.left + 9;
  const end = Math.max(start + 14, Math.min(rect.right - 15, phrase ? phrase.right - 4 : firstLine.right - 4));
  const y = firstLine.top + firstLine.height / 2;
  const loupe = document.createElement('span');
  loupe.className = 'reading-loupe';
  loupe.setAttribute('aria-hidden', 'true');
  loupe.innerHTML = '<i class="loupe-window"><span class="loupe-print"></span></i>';
  const print = loupe.querySelector('.loupe-print');
  print.textContent = line.textContent;
  print.style.fontStyle = 'normal';
  print.style.setProperty('--copy-width', rect.width + 'px');
  row.append(loupe);
  const scale = 1.35;
  const glass = x => `translate(${x-rowRect.left-17}px,${y-rowRect.top-17}px)`;
  const textAt = x => `translate(${15.5-(x-rect.left)*scale}px,${15.5-(y-rect.top)*scale}px) scale(${scale})`;
  const timing = { duration, easing: 'cubic-bezier(.32,.08,.46,1)', fill: 'both' };
  animateMotion(print, [{ transform: textAt(start) }, { transform: textAt(end) }], timing);
  const sweep = animateMotion(loupe, [{ transform: glass(start) }, { transform: glass(end) }], timing);
  animateMotion(loupe, [
    { opacity: 0 }, { opacity: 1, offset: .16 }, { opacity: 1, offset: .83 }, { opacity: 0 }
  ], { duration, easing: 'linear', fill: 'both' });
  sweep?.finished.then(() => loupe.remove(), () => loupe.remove());
}

function phraseSnapshot(el) {
  if (!el) return null;
  const range = document.createRange();
  range.selectNodeContents(el);
  const rect = range.getBoundingClientRect();
  return rect.width ? { rect, text: el.textContent } : null;
}

// Follow the same words to the actual destination, including the position chosen by the current sort.
function carryPhrase(from, target, duration, delay = 0, arc = 0) {
  if (!from || !target || motionPreference.matches || document.hidden) return;
  const to = target.getBoundingClientRect();
  const start = from.rect;
  if (to.bottom < 0 || to.top > innerHeight || start.bottom < 0 || start.top > innerHeight) return;
  const paper = document.createElement('span');
  paper.className = 'action-paper';
  paper.textContent = from.text;
  paper.setAttribute('aria-hidden', 'true');
  document.body.append(paper);
  const at = (x,y,tilt) => `translate(${x-4}px,${y-1}px) rotate(${tilt}deg)`;
  const flight = animateMotion(paper, [
    { transform: at(start.left,start.top,0), opacity: 1 },
    { transform: at((start.left+to.left)/2,(start.top+to.top)/2-arc,-(arc ? 2 : 0)), opacity: 1, offset: .48 },
    { transform: at(to.left,to.top,0), opacity: 0 }
  ], { duration, delay, easing: 'cubic-bezier(.4,.04,.18,1)', fill: 'both' });
  animateMotion(target, [{ opacity: 0 }, { opacity: 0, offset: .80 }, { opacity: 1 }], { duration, delay, easing: 'linear', fill: 'backwards' });
  if (flight) flight.finished.then(() => paper.remove(), () => paper.remove());
  else paper.remove();
}

function arrivalSnapshot(ids) {
  const from = new Map(ids.map(id => [id, phraseSnapshot(document.querySelector(`.urow[data-id="${CSS.escape(id)}"] .tt`))]));
  const positions = new Map([...document.querySelectorAll('#nList .nr')].map(el => [el.dataset.id, el.getBoundingClientRect().top]));
  return { from, positions };
}

function landInToday(snapshot, added) {
  if (!added.length) return;
  const list = $('#nList');
  const bounds = list?.getBoundingClientRect();
  document.querySelectorAll('#nList .nr').forEach(row => {
    const oldTop = snapshot.positions.get(row.dataset.id);
    const dy = oldTop - row.getBoundingClientRect().top;
    if (Number.isFinite(dy) && Math.abs(dy) > 1 && Math.abs(dy) < 160) animateMotion(row, [
      { transform: `translateY(${dy}px)` }, { transform: 'none' }
    ], { duration: 380 });
  });
  added.forEach((task,index) => {
    const row = list?.querySelector(`.nr[data-id="${CSS.escape(task.id)}"]`);
    const box = row?.getBoundingClientRect();
    if (!row || box.bottom <= bounds.top || box.top >= bounds.bottom) return;
    const delay = Math.min(index * 110, 330);
    carryPhrase(snapshot.from.get(task.originId), row.querySelector('.tx'), 640, delay, 33);
    animateMotion(row, [{ backgroundColor: '#e8f1ff' }, { backgroundColor: 'transparent' }], { duration: 580, delay: delay + 350 });
  });
  animateMotion($('#nTabs .view-title em'), [{ transform: 'scale(.82)' }, { transform: 'scale(1.16)', offset: .45 }, { transform: 'none' }], { duration: 330 });
}

function installPreviewMotion() {
  const originalRender = render;
  let displayedResult;
  let frame;
  let runId;
  const start = $('#demo-start');
  start.innerHTML = `<div class="motion-head">${art('search')}<div><b>小钉帮你找待办</b><div class="ss">从私聊、群消息和听记里找</div><button class="kbs" type="button" data-a="tidy">开始整理</button></div></div>`;

  render = function () {
    const previous = $('.motion-progress');
    const oldPose = previous?.querySelector('.figure img');
    const previousHeight = previous?.getBoundingClientRect().height;
    const oldRows = new Map([...previous?.querySelectorAll('.evidence-flow .evidence-row') || []].map(row =>
      [row.dataset.evidence, { row, rect: row.getBoundingClientRect(), phrase: phraseSnapshot(row.querySelector('mark')) }]));
    originalRender();
    if (!S) return;
    const p = ui.tidy;
    const current = $('.motion-progress');
    const result = $('.motion-results');
    const nextPose = (current || result)?.querySelector('.figure img');
    if (oldPose && nextPose && oldPose.src !== nextPose.src && !motionPreference.matches && !document.hidden) {
      const ghostPose = oldPose.cloneNode();
      ghostPose.style.cssText = 'position:absolute;inset:0;pointer-events:none';
      nextPose.parentElement.append(ghostPose);
      const leave = animateMotion(ghostPose, [{opacity:1,transform:'none'},{opacity:0,transform:'translate(-3px,2px) rotate(-5deg)'}],{duration:175});
      leave?.finished.then(() => ghostPose.remove(), () => ghostPose.remove());
      animateMotion(nextPose, [{opacity:.05,transform:'translateY(3px) rotate(3deg)'},{opacity:1,transform:'none'}],{duration:260});
    }
    const stage = p ? p.stage === 'think' ? 'extract' : 'read' : result ? 'deliver' : '';
    document.querySelectorAll('[data-preview-step]').forEach(button => {
      if (button.dataset.previewStep === stage) button.setAttribute('aria-current', 'step');
      else button.removeAttribute('aria-current');
      button.disabled = S.conn.state !== 'connected';
    });
    start.querySelector('button').disabled = S.conn.state !== 'connected';
    if (current && p?.previewFrame && (frame !== p.previewFrame || runId !== p.startedAt)) {
      frame = p.previewFrame;
      runId = p.startedAt;
      const height = current.getBoundingClientRect().height;
      if (previousHeight && previousHeight !== height) animateMotion(current,
        [{ height: previousHeight + 'px' }, { height: height + 'px' }], { duration: 365 });
      if (frame !== 'think') {
        const row = current.querySelector(`[data-evidence="${frame}"]`);
        animateMotion(row, [{ opacity: .1, transform: 'translate(-13px,8px) rotate(-1.4deg)' }, { opacity: 1, transform: 'none' }], { duration: 390 });
        animateMotion(current.querySelector('.figure'), [
          { transform: 'translate(4px,-1px) rotate(3deg)' }, { transform: 'translate(-6px,3px) rotate(-6deg)', offset: .48 }, { transform: 'none' }
        ], { duration: 880 });
        animateMotion(current.querySelector('.paper.front'), [
          { transform: 'translate(2px,1px) rotate(-9deg)' }, { transform: 'translate(-7px,-6px) rotate(-18deg)', offset: .55 }, { transform: 'rotate(-11deg)' }
        ], { duration: 880 });
        animateMotion(current.querySelector('[data-state="ing"] i'), [{transform:'scaleX(.02)'},{transform:'scaleX(1)'}], {duration: p.duration, easing:'linear',fill:'forwards'});
        setTimeout(() => { if (row?.isConnected) readThroughLens(row, p.duration - 300); }, 240);
      } else {
        const ghost = oldRows.get('group');
        if (ghost && !motionPreference.matches && !document.hidden) {
          const rect = current.getBoundingClientRect();
          ghost.row.classList.add('evidence-exit');
          ghost.row.setAttribute('aria-hidden','true');
          Object.assign(ghost.row.style, { top: ghost.rect.top-rect.top+'px', left: ghost.rect.left-rect.left+'px', width: ghost.rect.width+'px' });
          current.append(ghost.row);
          const fade = animateMotion(ghost.row, [{opacity:1},{opacity:0,transform:'translate(15px,1px) rotate(1deg)'}], {duration:250});
          fade?.finished.then(() => ghost.row.remove(), () => ghost.row.remove());
        }
        current.querySelectorAll('.evidence-flow .evidence-row').forEach(row => {
          const from = oldRows.get(row.dataset.evidence)?.rect;
          if (from) animateMotion(row, [{transform:`translateY(${from.top-row.getBoundingClientRect().top}px)`},{transform:'none'}], {duration:400});
        });
      }
    }
    if (result && displayedResult !== ui.tidyResult) {
      displayedResult = ui.tidyResult;
      const height = result.getBoundingClientRect().height;
      if (previousHeight) animateMotion(result,[{height:previousHeight+'px'},{height:height+'px'}],{duration:530});
      animateMotion(result.querySelector('.figure'), [{ transform:'translate(-6px,4px) rotate(-7deg)' },{ transform:'translate(3px,-3px) rotate(3deg)',offset:.62 },{transform:'none'}],{duration:650});
      result.querySelectorAll('.urow').forEach((row,index) => {
        const delay = index * 210;
        const source = oldRows.get(row.dataset.id.replace('motion-',''))?.phrase;
        carryPhrase(source,row.querySelector('.tt'),550,delay);
        for (const [i, node] of [...row.querySelector('.chips').children].entries()) {
          animateMotion(node,[{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'none'}],{duration:215,delay:delay + 200 + 28*i,fill:'backwards'});
        }
        animateMotion(row.querySelector('.bt'),[{opacity:0},{opacity:1}],{duration:220,delay:delay+280,fill:'backwards'});
      });
    }
  };

  let activeRun = null;
  let request = 0;
  async function playFrom(step) {
    const mine = ++request;
    if (activeRun) {
      await A('cancelTidy');
      await activeRun;
    }
    if (mine !== request || S.conn.state !== 'connected') return;
    document.querySelectorAll('.action-paper').forEach(paper => {
      for (const animation of paper.getAnimations()) animation.cancel();
      paper.remove();
    });
    const pending = runTidy({previewStep: step});
    activeRun = pending;
    try { await pending; } finally { if (activeRun === pending) activeRun = null; }
  }
  handlers.tidy = () => { if (!ui.tidy) playFrom('read'); };
  document.querySelectorAll('[data-preview-step]').forEach(button => {
    button.addEventListener('click', () => playFrom(button.dataset.previewStep));
  });
  handlers.previewQuote = el => {
    const id = el.dataset.id;
    if (openPreviewQuotes.has(id)) openPreviewQuotes.delete(id);
    else openPreviewQuotes.add(id);
    render();
    $(`[data-a="previewQuote"][data-id="${CSS.escape(id)}"]`)?.focus({preventScroll:true});
  };
}

window.previewStatus = (message) => {
  const status = document.querySelector('.preview-status');
  status.textContent = message;
  clearTimeout(window.previewStatus.timer);
  window.previewStatus.timer = setTimeout(() => { status.textContent = '示例数据'; }, 3500);
};

const POSE = (n) => previewPoses[n];
const AVC = ['#FFE2D3', '#ECE5FF', '#DDF3E4', '#FFF3D6', '#FCE4EC', '#E3F0FF'];
const avc = (name) => AVC[[...String(name || '?')].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length];
const PRI_NAME = { P0: '紧急', P1: '重要', P2: '一般' };

// ---------- 数据视图 ----------
const now = () => Date.now();
const rendererStartedAt = now();
const strikeDuration = 240;
const t0 = () => Sh.startOfDay();
const tasks = () => S?.tasks || [];
const open = () => tasks().filter((t) => !t.done);
const isOverdue = (t) => t.due && t.due <= (t.done ? t.doneAt : now());
const inToday = (t) => t.list === 'today';
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
const viewTasks = () => Views.selectTasks(tasks(), viewState.config);
const poolTasks = () => tasks().filter((t) => !inToday(t)).sort(byOrder);
const doneToday = () => tasks().filter((t) => t.done && t.doneAt >= t0());
const pending = () => (S?.candidates || []);
const bubbleQueue = () => pending().filter((c) => c.pushed && !c.bubbleSeen).sort((a, b) => (b.seenAt || 0) - (a.seenAt || 0));
const taskById = (id) => tasks().find((t) => t.id === id);
const candById = (id) => pending().find((c) => c.id === id) || [...(ui.tidyResult?.main || []), ...(ui.tidyResult?.maybe || [])].find((c) => c.id === id);
const workEnd = () => S?.settings?.workEnd || '18:30';
const deadlineLabel = (due, n = now()) => Sh.deadlineLabel(due, n, workEnd());

function flashInfo() {
  const n = now();
  const urgent = open().filter((t) => t.due && t.due > n && t.due - n <= 30 * 60e3 && (t.priority === 'P0' || t.priority === 'P1' || t.follow))
    .sort((a, b) => a.due - b.due)[0];
  if (urgent) {
    const minutes = Math.max(1, Math.round((urgent.due - n) / 60e3));
    const short = `${minutes} 分钟后截止`;
    return { kind: 'urgent', task: urgent, text: `${urgent.title} · ${short}`, short, pct: Math.min(100, Math.max(4, 100 - (urgent.due - n) / (30 * 60e3) * 100)) };
  }
  const unseen = pending().filter((c) => !c.bubbleSeen).length;
  if (unseen >= 5) return { kind: 'many', text: `有 ${unseen} 件还没看`, short: `有 ${unseen} 件还没看` };
  return null;
}
function poseNow() {
  const f = flashInfo();
  if (ui.tidy) return { p: ui.tidy.stage === 'think' ? 'think' : 'search', peek: true };
  if (f && f.kind === 'urgent') return { p: 'ring', peek: true };
  if (currentAlert() || (bubbleQueue().length && !ui.bubbleHidden)) return { p: 'hang', peek: true };
  if (f && f.kind === 'many') return { p: 'what', peek: true };
  if (ui.offWork) return { p: 'hug', peek: true };
  return { p: 'empty', peek: false };
}
const currentAlert = () => (S?.alerts || []).map(taskById).find((t) => t && !t.done);

function connChip(mini) {

  if (st === 'checking') return `<span class="conn">${I.spin(12)}<span class="st0">连接中</span><span class="dk">钉</span>钉钉</span>`;

}
function poseImg(big) {

}
function tidyBtn() {

const pchip = (p, ai, attrs) => p ? `<button class="pc p${p[1]}" ${attrs} aria-label="编辑优先级：${p}">${ai ? I.sp(9) : ''}${p}</button>` : '';

function tagPill(name) {
  const color = Array.from(Sh.tagKey(name)).reduce((sum, char) => sum + char.codePointAt(0), 0) % 5;
  return `<span class="custom-tag tone-${color}" title="${esc(name)}">${esc(name)}</span>`;
}
function tagSummary(names, attrs, compact = false) {
