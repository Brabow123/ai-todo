<main class="wrap">

<div class="intro"><h1>主动提醒</h1><p>看三条消息先后到达桌面。点最上面的气泡，可以展开这一叠提醒。</p></div>
<section class="preview" aria-labelledby="preview-title"><div class="bar"><h2 id="preview-title">桌面预览</h2><span class="spacer"></span><div class="seg" aria-label="便签形态"><button data-act="expand">展开便签</button><button data-act="collapse">收起便签</button></div><button class="demo-btn" data-act="arrive">来一条</button><button class="replay" data-act="replay">重播连续到达</button></div>
<div class="mac-scene"><div class="menubar" aria-hidden="true"><b>访达</b><span>文件</span><span>编辑</span><span>显示</span><span class="spacer"></span><svg class="icon" viewBox="0 0 24 24"><path d="M3 8q9-8 18 0M6 12q6-6 12 0m-9 4q3-3 6 0m-3 4h.1"/></svg><span>周五　10:24</span></div>
<div class="desk"><div class="desktop" id="desktop"><section id="note" class="note" aria-label="AI待办便签"></section><section id="slot" aria-label="右上角通知"><div id="rail" class="rail"></div><div id="group-action" class="group-control"></div></section></div></div></div>
<p class="caption"><strong id="scene-name"></strong><span id="caption"></span></p></section>
<section class="flow"><div class="flow-title"><h2>交互链路</h2><span>点选状态预览</span><span class="preview-refs"><a href="https://support.apple.com/en-gb/guide/mac-help/mh40609/mac" target="_blank" rel="noreferrer">参考 macOS 通知交互 ↗</a></span></div><nav class="steps" id="steps" aria-label="体验提醒状态"></nav></section>
<div class="sr" id="live" role="status" aria-live="polite"></div></main>
<script>
'use strict';
const shapes={
 play:'<path d="M7 4l13 8-13 8z"/>',
 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 6-2.5 7-2.5 8.5h17C20.5 15 18 14 18 8ZM10 20a2.5 2.5 0 0 0 4 0"/>',
 chat:'<path d="M4 5h16v12h-9l-5 3v-3H4z"/><path d="M8 10h8m-8 3h5"/>',
 stack:'<rect x="5" y="3" width="16" height="12" rx="3"/><path d="M3 9v7c0 2 1 3 3 3h10"/>',
 next:'<rect x="3" y="5" width="17" height="14" rx="3"/><path d="m9 9 3 3-3 3m6-6v6"/>',
 clear:'<circle cx="12" cy="12" r="8.5"/><path d="m8 12 3 3 5-6"/>',
 down:'<path d="m6 9 6 6 6-6"/>',up:'<path d="m6 15 6-6 6 6"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m9 6 6 6-6 6"/>',
 close:'<path d="m6 6 12 12M18 6 6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',reset:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>',
 tick:'<path d="m4 12 5 5L20 6"/>',filter:'<path d="M3 6h18M6 12h12M9 18h6"/>',sort:'<path d="M7 4v15m-3-3 3 3 3-3M13 6h7m-7 5h5m-5 5h3"/>'
};
const icon=(name,cl='')=>'<svg class="icon '+cl+'" aria-hidden="true" viewBox="0 0 24 24">'+shapes[name]+'</svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(act,html,cl='',attrs='')=>'<button type="button" data-act="'+act+'" class="'+cl+'" '+attrs+'>'+html+'</button>';
const samples=[
 ['确认下周评审时间','小林','私聊','P1','你帮忙确认一下下周的评审时间，定好了在群里说一声。'],
 ['补充移动端方案截图','设计协作群','群里 @你','P2','@你 移动端新方案还差两张截图，麻烦补进评审文档。'],
 ['回传用户访谈纪要','阿远','私聊','P1','访谈结束后，记得把纪要发我一份。'],
 ['核对本周发布清单','发布协作群','群里 @你','P0','@你 今天发布前，麻烦最后核对一下清单。'],
 ['确认新手引导文案','小乔','私聊','P2','新手引导的最后一句能帮忙确认一下吗？'],
 ['补全搜索空状态说明','体验小组','群里 @你','P2','@你 搜索没有结果时的说明也请补在稿子里。'],
 ['反馈导出体验','小陈','私聊','P1','你试完导出流程后，把反馈发我一下。'],
 ['整理下次讨论议题','项目群','群里 @你','P2','@你 周五讨论前麻烦整理一下议题。']
];
const scenes = [
 ['one','chat','一条到达','右侧滑入','一条到达','每条提醒独立停留 8 秒。指针停在这条通知上，计时会暂停。'],
 ['stack','stack','连续到达','逐层叠放','连续到达','最近一条在上，先到的提醒留在下面。点这叠通知即可展开。'],
 ['spread','next','展开通知','逐条操作','展开通知','每件事都有自己的气泡，可以查看来源、加入今天或忽略。'],
 ['park','bell','暂时收起','数量保留','暂时收起','收起只移走桌面上的气泡。点便签里的「提醒」可以重新打开。'],
 ['clear','clear','处理完毕','数量归零','没有剩余提醒','最后一个气泡退出后，新的消息仍会从同一位置出现。']
];
const key='ai-todo-mac-notifications-v1';
function initial(){return {queue:[],next:0,tasks:[{id:'base1',title:'更新本周 OKR',p:'P1',from:'自己记的'},{id:'base2',title:'整理标签交互笔记',p:'',due:'明天截止',from:'自己记的'},{id:'base3',title:'体验文档协作流程',p:'P2',from:'自己记的'}],pool:[{id:'pool1',title:'调研移动端批注体验',p:'P2',from:'自己记的'}]}}
function read(){try{const v=JSON.parse(localStorage.getItem(key));if(v&&Array.isArray(v.tasks)&&Array.isArray(v.pool)&&Array.isArray(v.queue)&&v.queue.every(id=>Number.isInteger(id)&&samples[id])&&Number.isInteger(v.next)&&v.next>=0&&v.next<=samples.length)return v}catch{}return null}
function save(){try{localStorage.setItem(key,JSON.stringify(model))}catch{}}
let model=read(),expanded=true,detail=false,pool=false,closed=false,draft='',visible=[],spread=false,idle=false,quoteId=null,playing=false;
const alarms=new Map(), playback=new Set();
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const opened=()=>visible.length>0||idle;
const say=t=>$('#live').textContent=t;
function clearAlarm(id){const a=alarms.get(id);if(a)clearTimeout(a.handle);alarms.delete(id)}
function clearAllAlarms(){for(const id of alarms.keys())clearAlarm(id)}
function pause(id){const a=alarms.get(id);if(!a||a.handle===null)return;clearTimeout(a.handle);a.left=Math.max(0,a.left-performance.now()+a.start);a.handle=null}
function resume(id){const a=alarms.get(id),row=$('.bubble-row[data-n="'+id+'"]');if(!a||a.handle!==null||document.hidden||row?.matches(':hover,:focus-within'))return;a.start=performance.now();a.handle=setTimeout(()=>hideOne(id),a.left)}
function stopPlayback(){for(const handle of playback)clearTimeout(handle);playback.clear();playing=false}
function fold(){visible=[];spread=false;idle=false;quoteId=null;clearAllAlarms()}
function hideOne(id){clearAlarm(id);visible=visible.filter(x=>x!==id);if(quoteId===id)quoteId=null;if(!visible.length){spread=false;idle=false}render();say('一条气泡已收起，便签中仍有 '+model.queue.length+' 条提醒')}
function arrive(sticky=false){if(model.next>=samples.length)return;const id=model.next++;model.queue.unshift(id);idle=false;
 if(!closed){visible.unshift(id);if(!spread&&!sticky)alarms.set(id,{left:8000,start:0,handle:null})}
 save();render();resume(id);say('新提醒，'+samples[id][0]);}
function expandAll(){stopPlayback();clearAllAlarms();spread=true;visible=model.queue.slice();idle=!visible.length;render()}
function settle(id,add){if(!model.queue.includes(id))return;clearAlarm(id);model.queue=model.queue.filter(x=>x!==id);visible=visible.filter(x=>x!==id);
 if(add){const [title,from,,p]=samples[id];model.tasks.push({id:'msg'+id,title,p,from})}
 if(quoteId===id)quoteId=null;if(!visible.length){spread=false;idle=false}save();render();say((add?'已加入今天':'已忽略')+'，剩余 '+model.queue.length+' 条');}
function startFromZero(){stopPlayback();fold();model=initial();closed=false;expanded=true;pool=false;detail=false;draft='';$('#rail').replaceChildren();save()}
function play(){startFromZero();playing=true;render();
 [400,1900,3400].forEach((delay,i)=>{const h=setTimeout(()=>{playback.delete(h);if(i===2)playing=false;arrive()},delay);playback.add(h)});}
function preset(k){if(k==='stack'){play();return}startFromZero();
 if(k==='clear'){model.next=2;model.tasks.push({id:'msg0',title:samples[0][0],p:samples[0][3],from:samples[0][1]});save();render();return}
 if(k==='one'){arrive();return}
 model.next=3;model.queue=[2,1,0];save();
 if(k==='spread')expandAll();else render();
}
const currentScene=()=>playing?'stack':!model.queue.length?'clear':!opened()?'park':spread?'spread':visible.length>1?'stack':'one';
function pri(p,tag='span'){return p?'<'+tag+' class="pri '+p.toLowerCase()+'">'+p+'</'+tag+'>':''}
function entry(){const n=model.queue.length;return btn('entry',icon('bell')+'提醒'+(n?'<b>'+n+'</b>':''),'entry'+(n?'':' empty'),'aria-label="提醒，剩余 '+n+' 条" aria-controls="slot" aria-expanded="'+opened()+'"')}
function note(){
 if(closed)return btn('reopen','重新打开便签','demo-btn');
 const head='<header class="note-head"><b class="appbrand"><span class="avatar"></span>AI待办</b><span class="connection">已连接 <span class="dk">钉</span> 钉钉 '+icon('down')+'</span><span class="note-action tidy">一键识别</span><span class="note-action off">下班</span>'+btn('quit',icon('close'),'ib chrome quit','aria-label="关闭示例便签" title="关闭示例便签"')+btn('shape',icon(expanded?'up':'down'),'ib chrome shape','aria-label="'+(expanded?'收起便签':'展开便签')+'"')+'</header>';
 if(!expanded)return head+'<div class="compact-entry">'+entry()+'</div>';
 const tasks=pool?model.pool:model.tasks;
 const scope='<div class="scope"><strong>'+(pool?'待办池':'今天')+'</strong><em>'+tasks.filter(t=>!t.done).length+'</em>'+icon('down')+'<span class="spacer"></span>'+btn('pool',pool?'‹ 今天':'待办池 '+model.pool.filter(t=>!t.done).length+' ›','pool')+'<div class="seg">'+btn('simple','简洁','','aria-pressed="'+!detail+'"')+btn('detail','详细','','aria-pressed="'+detail+'"')+'</div></div>';
 const tools='<div class="toolbar"><span class="tool">'+icon('filter')+'筛选</span><span class="tool">'+icon('sort')+'手动排序'+icon('down','chev')+'</span>'+entry()+'</div>';
 return head+scope+tools+'<div class="tasks">'+tasks.map(t=>'<div class="task'+(t.done?' checked':'')+'">'+btn('check',t.done?icon('tick'):'','check','data-id="'+esc(t.id)+'" role="checkbox" aria-checked="'+!!t.done+'" aria-label="完成 '+esc(t.title)+'"')+pri(t.p)+'<span class="name">'+esc(t.title)+(detail?'<br><small>'+esc(t.from)+'</small>':'')+'</span>'+(t.due?'<span class="deadline">'+t.due+'</span>':'')+'</div>').join('')+'</div><form class="composer"><input id="draft" aria-label="记一件事" value="'+esc(draft)+'" maxlength="120" autocomplete="off" placeholder="'+(pool?'记一件以后做的事，回车加入':'记一件事，回车加进今天')+'"></form>';
}
function banner(id,under) {
 const [title,who,channel,p,raw]=samples[id];
 const expandedSource=quoteId===id;
 const source='<span class="source-line"><span class="source-name">'+esc(who)+' · '+esc(channel)+'</span>'+(spread?btn('original',expandedSource?'收起原话':'看原话','source-link','aria-expanded="'+expandedSource+'"'):'')+'</span>';
 const options=spread?'<div class="actions">'+btn('ignore','忽略','ignore')+btn('add','加入今天','confirm')+'</div>':'';
 const surface=spread?'':btn('unfold','','card-surface','aria-label="展开提醒：'+esc(title)+'"');
 return '<div class="banner">'+surface+'<span class="app-icon" aria-label="AI待办"><span class="avatar"></span></span>'+source+'<span class="stamp">'+(id===model.next-1?'现在':'刚刚')+'</span><div class="subject">'+pri(p)+'<h3>'+esc(title)+'</h3></div>'+(expandedSource?'<blockquote class="raw">'+esc(raw)+'</blockquote>':'')+options+(!under?btn('dismiss',icon('close'),'cross','aria-label="收起这条气泡，保留提醒"'):'')+'</div>';
}
function animate(el,frames,ms,easing='cubic-bezier(.2,.78,.23,1)'){
 if(!reduced())return el.animate(frames,{duration:ms,easing});
}
function paintBanners(){
 const rail=$('#rail'),old=new Map(Array.from(rail.children,el=>[Number(el.dataset.n),{el,rect:el.getBoundingClientRect()}]));
 const ids=closed?[]:spread?visible:visible.slice(0,3);
 for(const [id,{el,rect}] of old){
  if(ids.includes(id))continue;
  if(!reduced()&&rect.height>0){
   const scene=$('.mac-scene'),box=scene.getBoundingClientRect(),ghost=el.cloneNode(true);
   ghost.classList.add('ghost-banner');ghost.inert=true;ghost.setAttribute('aria-hidden','true');
   ghost.style.cssText='left:'+(rect.left-box.left)+'px;top:'+(rect.top-box.top)+'px;width:'+rect.width+'px;height:'+rect.height+'px;z-index:5';
   scene.append(ghost);
   const animation=animate(ghost,[{opacity:.9,transform:'translateX(0)'},{opacity:0,transform:'translateX(85px)'}],200,'ease-in');
   if(animation)animation.finished.finally(()=>ghost.remove());else ghost.remove();
  }el.remove();
 }
 rail.classList.toggle('spread',spread);
 ids.forEach((id,index)=>{
  const before=old.get(id),el=before?.el||document.createElement('article'),under=!spread&&index>0;
  el.dataset.n=id;el.className='bubble-row'+(under?' under':'');el.style.setProperty('--width',under?'calc(100% - '+(index*10)+'px)':'100%');
  el.style.setProperty('--z',ids.length-index);el.setAttribute('aria-label',samples[id][0]);
  const html=banner(id,under);if(el._html!==html){el.innerHTML=html;el._html=html}
  if(rail.children[index]!==el)rail.insertBefore(el,rail.children[index]||null);
 });
 const rects=ids.map((id,i)=>{const el=rail.children[i];return {id,el,rect:el.getBoundingClientRect()}});
 for(const {id,el,rect} of rects){
  const was=old.get(id);
  if(!was){animate(el,[{transform:'translateX(calc(100% + 24px))',opacity:.25},{transform:'translateX(0)',opacity:1}],430);continue}
  const dy=was.rect.top-rect.top;if(Math.abs(dy)>1)animate(el,[{transform:'translateY('+dy+'px)'},{transform:'translateY(0)'}],330);
 }
 let action='';
 if(!closed&&ids.length){
   if(spread)action=btn('regroup',icon('up')+'叠起');
   else if(model.queue.length>1)action=btn('unfold','展开 '+model.queue.length+' 条 '+icon('down'));
 }else if(!closed&&idle)action='<span class="no-alert">暂时没有新提醒</span>';
 if($('#group-action')._html!==action){$('#group-action').innerHTML=action;$('#group-action')._html=action}
}
function render(focus){
 const focused=document.activeElement,oldAct=focused?.dataset.act,origin=focused?.closest('[data-n]')?.dataset.n;
 const editing=focused?.id==='draft',sel=editing?focused.selectionStart:null;
 const desktop=$('#desktop');desktop.classList.toggle('compact',!expanded);desktop.classList.toggle('box-closed',closed);
 const noteEl=$('#note'),nh=note();if(noteEl._html!==nh){noteEl.innerHTML=nh;noteEl._html=nh}
 paintBanners();
 const s=scenes.find(s=>s[0]===currentScene());$('#scene-name').textContent=s[4];$('#caption').textContent=closed?'从示例便签的入口可重新打开。':s[5];
 const steps=scenes.map(x=>btn('scene',icon(x[1])+'<span><b>'+x[2]+'</b><small>'+x[3]+'</small></span>','step','data-scene="'+x[0]+'" aria-pressed="'+(x===s)+'"')).join('');
 if($('#steps')._html!==steps){$('#steps').innerHTML=steps;$('#steps')._html=steps}
 const add=$('[data-act=arrive]');add.innerHTML=icon('plus')+(model.next>=samples.length?'示例已发完':'来一条');add.disabled=model.next>=samples.length;
 $('[data-act=replay]').innerHTML=icon('play')+'重播连续到达';
 for(const a of ['expand','collapse'])$('[data-act='+a+']').setAttribute('aria-pressed',!closed&&(a==='expand'?expanded:!expanded));
 if(focus)$(focus)?.focus({preventScroll:true});
 else if(editing&&!focused.isConnected&&$('#draft')){$('#draft').focus({preventScroll:true});$('#draft').setSelectionRange(sel,sel)}
 else if(oldAct&&!focused.isConnected){
  const base=origin!==undefined?'#rail [data-n="'+origin+'"] ':'';
  const target=oldAct==='scene'?'[data-scene="'+focused.dataset.scene+'"]':base+'[data-act="'+oldAct+'"]';
  ($(target)||$('#rail [data-act=add]')||$('.entry'))?.focus({preventScroll:true});
 }
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act,id=Number(b.closest('[data-n]')?.dataset.n);
 if(act==='replay'){play();return}
 if(act==='scene'){preset(b.dataset.scene);$('[data-scene="'+b.dataset.scene+'"]').focus({preventScroll:true});return}
 if(act==='arrive'){stopPlayback();arrive();return}
 if(act==='entry'){
  stopPlayback();
  if(opened()&&(spread||visible.length===model.queue.length)){fold();render('.entry')}
  else expandAll();return;
 }
 if(act==='unfold'){expandAll();return}
 if(act==='regroup'){spread=false;quoteId=null;render();return}
 if(act==='original'){quoteId=quoteId===id?null:id;render();return}
 if(act==='dismiss'){stopPlayback();hideOne(id);return}
 if(act==='add'||act==='ignore'){settle(id,act==='add');return}
 if(act==='quit'){stopPlayback();closed=true;fold();render('[data-act=reopen]');return}
 if(act==='shape'||act==='reopen'||act==='expand'||act==='collapse'){closed=false;expanded=act==='shape'?!expanded:act!=='collapse';render();return}
 if(act==='pool'){pool=!pool;draft='';render();return}
 if(act==='detail'||act==='simple'){detail=act==='detail';render();return}
 if(act==='check'){const t=(pool?model.pool:model.tasks).find(t=>t.id===b.dataset.id);if(t)t.done=!t.done;save();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened()){stopPlayback();fold();render('.entry')}});
const rail=$('#rail');
for(const type of ['pointerover','pointerout','focusin','focusout'])rail.addEventListener(type,e=>{
 const row=e.target.closest('[data-n]');if(!row||row.contains(e.relatedTarget))return;
 if(type==='pointerover'||type==='focusin')pause(Number(row.dataset.n));else queueMicrotask(()=>resume(Number(row.dataset.n)));
});
document.addEventListener('visibilitychange',()=>{for(const id of alarms.keys())document.hidden?pause(id):resume(id)});
document.addEventListener('input',e=>{if(e.target.id==='draft')draft=e.target.value});
document.addEventListener('submit',e=>{if(!e.target.matches('.composer'))return;e.preventDefault();if(!draft.trim())return;(pool?model.pool:model.tasks).push({id:'user'+Date.now(),title:draft.trim(),p:'',from:'自己记的'});draft='';save();render('#draft')});
if(!model)play();else render();
</script></body></html>
